<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅游网站背景图示例</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url('travel-background.jpg'); /* 背景图路径 */
      background-size: cover; /* 背景图覆盖整个页面 */
      background-position: center; /* 背景图居中 */
      background-repeat: no-repeat; /* 不重复 */
      color: #333; /* 文字颜色 */
    }

    .content {
      padding: 50px;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.8); /* 半透明背景，确保文字可读 */
      margin: 100px auto;
      max-width: 800px;
      border-radius: 10px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>欢迎来到我们的旅游网站</h1>
    <p>探索世界各地的美丽风景，规划您的下一次旅行！</p>
  </div>
</body>
</html>
